<section class="modulex-fiyat-sekmeli-secici{{fbsinif}}" {{fbetiket}}>
  <div class="modulex-fiyat-sekmeli-secici-ic">
    {{fbbas}}
    {{fbgovde}}
  </div>
</section>

<style>
  /* fiyat-sekmeli-secici — Paketler yan yana değil, tek tek incelenir (sekme etkileşimi) — çok maddeli, uzun özellik listeli paketler için; JS yoksa paneller alt alta. */
  .modulex-fiyat-sekmeli-secici { box-sizing: border-box; width: 100%; padding: --bosluk-- 20px; background: --bg--; color: --text--; font-size: 1rem; line-height: 1.6; font-family: var(--mx-font-sans, inherit); overflow-wrap: break-word; }
  .modulex-fiyat-sekmeli-secici *, .modulex-fiyat-sekmeli-secici *::before, .modulex-fiyat-sekmeli-secici *::after { box-sizing: border-box; }
  /* ham/css.css «* { font-size: 14px }» kalıtımı keser — modül içinde boyut üstten gelsin (ikon yazı tipi hariç) */
  .modulex-fiyat-sekmeli-secici :where(*:not(.material-symbols-outlined)) { font-size: inherit; }
  /* aynı «*» kuralı font-weight 400 · line-height 1.2 · font-family de basar — modül içinde kalıtım */
  .modulex-fiyat-sekmeli-secici :where(*:not(.material-symbols-outlined)) { font-weight: inherit; line-height: inherit; font-family: inherit; }
  .modulex-fiyat-sekmeli-secici :where(h2, h3, h4, p, ul, ol, li, figure, blockquote, dl, dd) { margin: 0; }
  .modulex-fiyat-sekmeli-secici :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-fiyat-sekmeli-secici img { display: block; max-width: 100%; }
  /* <img width height> öznitelik yüksekliği CSS aspect-ratio'yu ezer — sıfır özgüllükle auto (modül sınıfının height'ı yine kazanır) */
  :where(.modulex-fiyat-sekmeli-secici) img { height: auto; }
  .modulex-fiyat-sekmeli-secici [hidden] { display: none !important; }
  .modulex-fiyat-sekmeli-secici :where(a, button, summary, [data-cevir]) { cursor: pointer; }
  .modulex-fiyat-sekmeli-secici :where(a, button, summary, [tabindex]):focus-visible { outline: 3px solid --accent--; outline-offset: 3px; }
  .modulex-fiyat-sekmeli-secici-ic { max-width: --max--; margin-inline: auto; }
  .modulex-fiyat-sekmeli-secici-bas { display: grid; gap: 12px; margin-block-end: clamp(32px, 4vw, 52px); }
  .modulex-fiyat-sekmeli-secici--bassiz .modulex-fiyat-sekmeli-secici-bas { display: none; }
  .modulex-fiyat-sekmeli-secici-ust { color: --accentInk--; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
  .modulex-fiyat-sekmeli-secici-baslik { font-family: var(--mx-font-heading, inherit); font-size: clamp(1.8rem, 3.4vw, 2.8rem); font-weight: 750; letter-spacing: -0.025em; line-height: 1.1; }
  .modulex-fiyat-sekmeli-secici-metin { color: --muted--; font-size: 1.05rem; line-height: 1.7; }
  .modulex-fiyat-sekmeli-secici-bas { max-width: 780px; margin-inline: auto; text-align: center; justify-items: center; }
  .modulex-fiyat-sekmeli-secici-cta { display: flex; flex-wrap: wrap; gap: 12px; margin-block-start: 8px; }
  .modulex-fiyat-sekmeli-secici-dugme { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: --accent--; color: --accentText--; font-weight: 700; text-decoration: none; transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease; }
  .modulex-fiyat-sekmeli-secici-dugme:hover { transform: translateY(-2px); }
  .modulex-fiyat-sekmeli-secici-dugme--ikincil { background: transparent; color: --text--; border-color: --cizgi--; }
  .modulex-fiyat-sekmeli-secici-dugme--ikincil:hover { border-color: --accent--; }
  .modulex-fiyat-sekmeli-secici-dugme .material-symbols-outlined { font-size: 20px; }

  .modulex-fiyat-sekmeli-secici-tutar { font-family: var(--mx-font-heading, inherit); font-size: clamp(2rem, 3.6vw, 2.8rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .modulex-fiyat-sekmeli-secici-donem { margin-inline-start: 6px; color: --muted--; font-size: 0.95rem; font-weight: 600; }
  .modulex-fiyat-sekmeli-secici-fiyat { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px; }
  .modulex-fiyat-sekmeli-secici-pad { font-size: 1.2rem; font-weight: 750; letter-spacing: -0.01em; }
  .modulex-fiyat-sekmeli-secici-not { color: --muted--; }
  .modulex-fiyat-sekmeli-secici-oz { display: grid; gap: 10px; }
  .modulex-fiyat-sekmeli-secici-oz li { display: flex; align-items: flex-start; gap: 10px; line-height: 1.5; }
  .modulex-fiyat-sekmeli-secici-oz .material-symbols-outlined { flex: none; display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 16px; }
  .modulex-fiyat-sekmeli-secici-rozet { display: inline-flex; align-items: center; justify-self: start; min-height: 28px; padding: 4px 12px; border-radius: 999px; background: --accent--; color: --accentText--; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-fiyat-sekmeli-secici-pcta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 22px; border: 2px solid --accent--; border-radius: 999px; background: transparent; color: --text--; font-weight: 700; text-decoration: none; transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease; }
  .modulex-fiyat-sekmeli-secici-pcta:hover { background: --accent--; color: --accentText--; transform: translateY(-2px); }
  .modulex-fiyat-sekmeli-secici-pcta .material-symbols-outlined { font-size: 20px; }

  .modulex-fiyat-sekmeli-secici-cipler { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-block-end: 24px; }
  .modulex-fiyat-sekmeli-secici:not(.modulex-fiyat-sekmeli-secici--js) .modulex-fiyat-sekmeli-secici-cipler { display: none; }
  .modulex-fiyat-sekmeli-secici-cip { position: relative; display: inline-grid; justify-items: center; gap: 2px; min-width: 132px; min-height: 56px; padding: 10px 20px; border: 1px solid --cizgi--; border-radius: 16px; background: --kartBg--; color: --text--; font: inherit; transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease, transform 0.25s ease; }
  .modulex-fiyat-sekmeli-secici-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-fiyat-sekmeli-secici-cip[aria-selected="true"] { border-color: --accent--; background: --accent--; color: --accentText--; }
  .modulex-fiyat-sekmeli-secici-cad { font-weight: 750; }
  .modulex-fiyat-sekmeli-secici-cfiyat { font-size: 0.88rem; font-weight: 600; font-variant-numeric: tabular-nums; }
  .modulex-fiyat-sekmeli-secici-cnokta { position: absolute; inset-block-start: 8px; inset-inline-end: 8px; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .modulex-fiyat-sekmeli-secici-paneller { display: grid; gap: 18px; }
  .modulex-fiyat-sekmeli-secici-panel { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.3fr); gap: clamp(24px, 4vw, 56px); padding: clamp(26px, 4vw, 48px); border: 1px solid --cizgi--; border-radius: calc(--yuvarlak-- + 4px); background: --kartBg--; animation: modulex-fiyat-sekmeli-secici-gel 0.45s ease both; }
  .modulex-fiyat-sekmeli-secici-panel--vurgu { border: 2px solid --accent--; }
  @keyframes modulex-fiyat-sekmeli-secici-gel { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .modulex-fiyat-sekmeli-secici-psol { display: grid; align-content: start; gap: 14px; }
  .modulex-fiyat-sekmeli-secici-pbas { font-size: clamp(1.5rem, 2.6vw, 2rem); font-weight: 800; }
  .modulex-fiyat-sekmeli-secici-psol .modulex-fiyat-sekmeli-secici-tutar { font-size: clamp(2.6rem, 5vw, 3.6rem); }
  .modulex-fiyat-sekmeli-secici-psol .modulex-fiyat-sekmeli-secici-pcta { justify-self: start; background: --accent--; color: --accentText--; }
  .modulex-fiyat-sekmeli-secici-panel .modulex-fiyat-sekmeli-secici-oz { grid-template-columns: repeat(2, minmax(0, 1fr)); align-content: start; gap: 14px 24px; padding-inline-start: clamp(0px, 3vw, 40px); border-inline-start: 1px solid --cizgi--; }
  @media (max-width: 768px) {
    .modulex-fiyat-sekmeli-secici-cip { flex: 1 1 40%; min-width: 0; }
    .modulex-fiyat-sekmeli-secici-panel { grid-template-columns: minmax(0, 1fr); }
    .modulex-fiyat-sekmeli-secici-panel .modulex-fiyat-sekmeli-secici-oz { grid-template-columns: minmax(0, 1fr); padding-inline-start: 0; padding-block-start: 20px; border-inline-start: 0; border-block-start: 1px solid --cizgi--; }
  }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-fiyat-sekmeli-secici :is(.modulex-fiyat-sekmeli-secici-baslik, .modulex-fiyat-sekmeli-secici-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-fiyat-sekmeli-secici-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-fiyat-sekmeli-secici { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-fiyat-sekmeli-secici *, .modulex-fiyat-sekmeli-secici *::before, .modulex-fiyat-sekmeli-secici *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-fiyat-sekmeli-secici";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const sekme = (s, P) => {
        const t = [...s.querySelectorAll("[role=tab]")];
        const p = [...s.querySelectorAll("[role=tabpanel]")];
        if (!t.length) return;
        s.classList.add(P + "--js");
        const sec = (i, odak) => {
          t.forEach((x, j) => { x.setAttribute("aria-selected", String(i === j)); x.tabIndex = i === j ? 0 : -1; });
          p.forEach((x, j) => { x.hidden = i !== j; });
          if (odak) t[i].focus();
        };
        sec(0);
        t.forEach((x, i) => {
          x.addEventListener("click", () => sec(i));
          x.addEventListener("keydown", (e) => {
            const rtl = getComputedStyle(s).direction === "rtl";
            const ileri = rtl ? "ArrowLeft" : "ArrowRight";
            const geri = rtl ? "ArrowRight" : "ArrowLeft";
            let n = -1;
            if (e.key === ileri || e.key === "ArrowDown") n = (i + 1) % t.length;
            else if (e.key === geri || e.key === "ArrowUp") n = (i - 1 + t.length) % t.length;
            else if (e.key === "Home") n = 0;
            else if (e.key === "End") n = t.length - 1;
            if (n > -1) { e.preventDefault(); sec(n, true); }
          });
        });
      };
    const fiyatIlk = (s) => {
        const l = s.querySelector("[role=tablist][data-ilk]");
        const i = l ? Number(l.dataset.ilk) : 0;
        const t = l ? l.querySelectorAll("[role=tab]")[i] : null;
        if (i > 0 && t) t.click();
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      sekme(s, P, az);
      fiyatIlk(s, P, az);
    });
  })();
</script>
